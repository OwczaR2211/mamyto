<html lang="pl" data-theme="szron">
<head>

<style>
html[data-theme=szron]{--bg1:#eef5fb;--bg2:#d9e7f5;--card:#ffffff;--card2:#f1f5fa;--text:#10223a;--muted:#6b7c93;--line:rgba(16,34,58,.08);--acc:#2f7cf6;--acc2:#4fc3ff;--onacc:#fff;--sh:0 6px 22px rgba(30,60,110,.10);--tab:rgba(255,255,255,.78)}
html[data-theme=truskawka]{--bg1:#fff2f4;--bg2:#ffdbe3;--card:#ffffff;--card2:#fff3f5;--text:#3a1020;--muted:#9a6b78;--line:rgba(58,16,32,.08);--acc:#ff3b6b;--acc2:#ff9a8b;--onacc:#fff;--sh:0 6px 22px rgba(160,30,70,.12);--tab:rgba(255,255,255,.8)}
html[data-theme=matcha]{--bg1:#f3f6ea;--bg2:#e0ead0;--card:#fffef8;--card2:#f4f6ec;--text:#1f2a14;--muted:#6f7a5f;--line:rgba(31,42,20,.09);--acc:#4f8a22;--acc2:#a7c957;--onacc:#fff;--sh:0 6px 22px rgba(60,90,20,.12);--tab:rgba(255,254,248,.8)}
html[data-theme=brzoskwinia]{--bg1:#fff5ec;--bg2:#ffdcc2;--card:#ffffff;--card2:#fff6ef;--text:#3b2412;--muted:#9a7a63;--line:rgba(59,36,18,.08);--acc:#ff6a2b;--acc2:#ffbf4d;--onacc:#fff;--sh:0 6px 22px rgba(160,80,20,.13);--tab:rgba(255,255,255,.8)}
html[data-theme=noc]{--bg1:#0b0d18;--bg2:#161a35;--card:#1a1f3a;--card2:#242a4b;--text:#eef0ff;--muted:#8d93b8;--line:rgba(255,255,255,.07);--acc:#8b7bff;--acc2:#3de3c4;--onacc:#fff;--sh:0 8px 26px rgba(0,0,0,.35);--tab:rgba(20,24,46,.82);color-scheme:dark}
html[data-theme=moro]{--bg1:#121510;--bg2:#1f2417;--card:#22281a;--card2:#2d3423;--text:#e9ecd9;--muted:#99a083;--line:rgba(233,236,217,.07);--acc:#a9b84c;--acc2:#d9a441;--onacc:#16190f;--sh:0 8px 26px rgba(0,0,0,.35);--tab:rgba(30,35,24,.85);color-scheme:dark}
:root{--ok:#1fb874;--warn:#f39a1c;--bad:#ef4565;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1);color:var(--text);min-height:100vh;font-weight:600;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:'';position:fixed;inset:-10%;pointer-events:none;z-index:-1;
 background:radial-gradient(38% 26% at 90% 2%,color-mix(in srgb,var(--acc2) 38%,transparent),transparent 70%),radial-gradient(34% 24% at -5% 38%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%),radial-gradient(30% 20% at 100% 80%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font-size:16px}
#view{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px);max-width:640px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 14px}
.hi{color:var(--muted);font-size:15px;font-weight:700}
h1{font-size:36px;font-weight:900;margin:0;letter-spacing:-.5px;line-height:1.05}
.cloud{font-size:12px;font-weight:800;padding:6px 10px;border-radius:99px;background:var(--card);box-shadow:var(--sh);color:var(--muted);white-space:nowrap}
.cloud.on{color:var(--ok)} .cloud.err{color:var(--bad)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 6px 8px}
.ghead .n{margin-left:auto;font-size:12px;opacity:.8}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:62px}
.group .row:first-child{border-top:0}
.emo{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.mid{flex:1;min-width:0}
.nm{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--muted)}
.b-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#c97400}
html[data-theme=noc] .b-warn,html[data-theme=moro] .b-warn{color:var(--warn)}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-acc{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty span{min-width:54px;text-align:center;font-weight:900;font-size:15px}
.qty span.zero{color:var(--bad);font-size:13px}
.qb{width:34px;height:34px;border-radius:12px;background:var(--card2);font-size:20px;font-weight:900;display:grid;place-items:center;color:var(--acc)}
.qb:active{transform:scale(.9)}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.al{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px;text-align:left}
.al b{display:block;font-size:26px;font-weight:900;line-height:1}
.al small{font-size:12px;color:var(--muted);font-weight:800}
.al.bad b{color:var(--bad)} .al.warn b{color:var(--warn)} .al.acc b{color:var(--acc)}
.search{width:100%;border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:13px 16px;outline:none;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:14px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc)}
.chip small{opacity:.7;margin-left:4px}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(env(safe-area-inset-bottom) + 92px);width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-size:34px;font-weight:700;box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 45%,transparent);z-index:20;display:grid;place-items:center;line-height:1}
.fab:active{transform:scale(.92)}
.tabs{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:460px;margin:0 auto;z-index:30;display:flex;justify-content:space-around;padding:8px 6px;border-radius:26px;background:var(--tab);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted);position:relative;padding:4px 0}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
.tab .cnt[hidden]{display:none}
.tab .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:6px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:900;font-size:16px;background:var(--card2);color:var(--text)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.full{width:100%}
.btn:active{transform:scale(.97)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
/* shopping */
.addbar{display:flex;gap:8px;margin-bottom:6px}
.addbar input{flex:1;border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:14px 16px;outline:none;min-width:0}
.addbar button{width:52px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-size:26px;font-weight:800}
#sugg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px;min-height:0}
#sugg button{padding:7px 11px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:13.5px;font-weight:800}
.chk{width:28px;height:28px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--muted) 55%,transparent);flex:none;display:grid;place-items:center;transition:.15s}
.shop.done .chk{background:var(--ok);border-color:var(--ok)}
.shop.done .chk::after{content:'';width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.shop.done .nm{text-decoration:line-through;opacity:.5}
.shop.done .emo{opacity:.5}
.more{width:34px;height:34px;border-radius:12px;color:var(--muted);font-size:20px;font-weight:900;flex:none}
.sq{font-weight:900;color:var(--muted);font-size:14px;flex:none}
.who{width:22px;height:22px;border-radius:50%;background:var(--card2);font-size:11px;font-weight:900;display:inline-grid;place-items:center;color:var(--acc)}
.finish{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:25;max-width:608px;margin:0 auto}
/* expenses */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav button{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:18px;font-weight:900}
.monthnav b{font-size:18px;font-weight:900}
.hero{display:flex;align-items:center;gap:16px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;line-height:1.05}
.ring .in small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.big-amt{font-size:30px;font-weight:900;letter-spacing:-.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--bad)} .down{color:var(--ok)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:38px;border-radius:10px 10px 6px 6px;background:var(--card2);min-height:4px}
.bar.on i{background:linear-gradient(180deg,var(--acc2),var(--acc))}
.bar small{font-size:11.5px;color:var(--muted);font-weight:800}
.bar em{font-style:normal;font-size:10.5px;font-weight:900;color:var(--muted)}
.hb{margin:10px 0}
.hb .l{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:5px}
.hb .t{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ctitle{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.amt{font-weight:900;font-size:16px;flex:none}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.open{pointer-events:auto}
.sh-back{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .22s}
#sheet.open .sh-back{opacity:1}
.sh-card{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg1);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);-webkit-overflow-scrolling:touch}
#sheet.open .sh-card{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.35;margin:2px auto 12px}
.sh-card h2{font-size:24px;font-weight:900;margin:0 0 14px}
.f{margin-bottom:14px}
.f>label{display:block;font-size:13px;font-weight:900;color:var(--muted);margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.5px}
.inp{width:100%;border:0;border-radius:15px;background:var(--card);padding:13px 15px;outline:none;box-shadow:var(--sh)}
textarea.inp{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.inp.amtin{font-size:30px;font-weight:900;text-align:center;padding:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:10px 13px;border-radius:13px;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:14px}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:15px;background:var(--card);box-shadow:var(--sh);font-size:24px;font-weight:900;color:var(--acc)}
.stepper input{flex:1;text-align:center;font-size:22px;font-weight:900}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:15px;padding:13px 15px;box-shadow:var(--sh)}
.sw b{font-weight:800}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.tg{width:52px;height:32px;border-radius:16px;background:var(--card2);position:relative;flex:none;transition:.2s;border:1px solid var(--line)}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.tg.on{background:var(--ok)}
.tg.on::after{left:23px}
.steps{padding-left:20px;margin:0 0 14px;line-height:1.5;font-size:14.5px}
.steps li{margin-bottom:6px}
.steps code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--card2);padding:2px 5px;border-radius:6px}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh);max-height:140px;overflow:auto;user-select:all;-webkit-user-select:all}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border-radius:18px;padding:10px;text-align:left;box-shadow:var(--sh);border:2.5px solid transparent;font-weight:900;font-size:13px}
.th.on{border-color:var(--acc)}
.th .sw3{display:flex;gap:4px;margin-bottom:8px}
.th .sw3 i{width:18px;height:18px;border-radius:6px}
.th .e{font-size:20px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:60;max-width:560px;margin:0 auto;background:var(--text);color:var(--bg1);border-radius:18px;padding:13px 15px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(24px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s;pointer-events:none}
#toast.show{transform:none;opacity:1;visibility:visible;pointer-events:auto}
#toast span{flex:1}
#toast button{padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--bg1) 18%,transparent);color:var(--bg1);font-weight:900;font-size:13.5px}
.scanning{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Dodaj">+</button>
<nav class="tabs" id="tabs">
 <button class="tab" data-tab="zapasy"><svg viewBox="0 0 24 24"><rect x="5.5" y="2.5" width="13" height="19" rx="3"/><path d="M5.5 9.5h13M9 5.3v1.8M9 12.3v3"/></svg>Zapasy</button>
 <button class="tab" data-tab="zakupy"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Zakupy<i class="cnt" id="shopCnt" hidden></i></button>
 <button class="tab" data-tab="wydatki"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="13.5" rx="3"/><path d="M3 10.5h18M15.5 15h2.5M6 6.5l9-3.2 1.6 3.2"/></svg>Wydatki</button>
 <button class="tab" data-tab="ustawienia"><svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg>Więcej</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ============ Mamy to? — wspólna lodówka, zakupy i wydatki ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const r2=n=>Math.round((+n||0)*100)/100;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysLeft=e=>{if(!e)return null;const a=new Date(e+'T00:00:00'),b=new Date(todayStr()+'T00:00:00');return Math.round((a-b)/864e5)};
const parseNum=s=>{const v=parseFloat(String(s).replace(',','.').replace(/[^\d.\-]/g,''));return isNaN(v)?0:v};

/* ---------- słowniki ---------- */
const CATS=[
 ['owoce-warzywa','Owoce i warzywa','🥦'],['pieczywo','Pieczywo','🥖'],['nabial','Nabiał i jajka','🧀'],['mieso','Mięso, ryby, wędliny','🥩'],

function known(){
 const m=new Map();
 CATALOG.forEach(c=>m.set(norm(c.name),c));
 Object.values(D.items).forEach(i=>m.set(norm(i.name),{name:i.name,cat:i.cat,unit:i.unit,emoji:i.emoji}));
 return m;
}
function guess(name){
 const n=norm(name);if(!n)return{cat:'inne',unit:'szt',emoji:'📦'};
 const k=known();if(k.has(n))return k.get(n);
 for(const c of CATALOG){const cn=norm(c.name);if(n.length>=3&&(n.includes(cn)||cn.includes(n)))return c}
 for(const c of CATALOG){const st=norm(c.name).slice(0,4);if(st.length>=4&&n.startsWith(st))return c}
 return{cat:'inne',unit:'szt',emoji:'📦'};
}
const emojiFor=o=>o.emoji||guess(o.name).emoji||CAT[o.cat]?.emo||'📦';
const findItem=name=>Object.values(D.items).find(i=>norm(i.name)===norm(name));
function conv(q,from,to){
 if(from===to)return q;
 if(from==='g'&&to==='kg')return q/1000; if(from==='kg'&&to==='g')return q*1000;
 if(from==='ml'&&to==='l')return q/1000; if(from==='l'&&to==='ml')return q*1000;
 return q;
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Brak internetu albo zablokowany skrypt'));document.head.appendChild(s)})}
const FB='https://cdn.jsdelivr.net/npm/firebase@10.14.1/';
async function connectCloud(sync,uploadLocal){
 S.cloud='connecting';render();
 if(!window.firebase){await loadScript(FB+'firebase-app-compat.js');await loadScript(FB+'firebase-firestore-compat.js')}
 const old=firebase.apps.find(a=>a.name==='mt');if(old)await old.delete();
 const app=firebase.initializeApp(sync.config,'mt');
 const db=app.firestore();
 try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
 home=db.collection('domy').doc(sync.house);
 if(uploadLocal){
  const ops=[];['items','shop','exp','cfg'].forEach(c=>Object.values(D[c]).forEach(o=>ops.push([c,o])));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(([c,o])=>b.set(home.collection(c).doc(o.id),clean(o)));await b.commit()}
 }
 await home.set({upd:Date.now()},{merge:true});
 unsubs.forEach(u=>u());unsubs=[];
 ['items','shop','exp','cfg'].forEach(col=>{
  unsubs.push(home.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{
   const m={};snap.forEach(d=>m[d.id]=d.data());D[col]=m;saveLocal();
   S.cloud=snap.metadata.fromCache?'offline':'online';later();
  },err=>cloudFail(err)));
 });
}

function autoShop(){
 Object.values(D.items).forEach(it=>{
  const sid='auto_'+it.id,ex=D.shop[sid];
  const min=+it.min||0,need=r2(min-(+it.qty||0));
  if(min>0&&need>0&&it.noAuto!==it.qty){
   if(!ex)put('shop',{id:sid,name:it.name,qty:need,unit:it.unit,cat:it.cat,emoji:it.emoji||'',itemId:it.id,auto:true,done:false,ts:Date.now()});
   else if(!ex.done&&ex.qty!==need)put('shop',{...ex,qty:need});
  }else if(ex&&!ex.done&&ex.auto){del('shop',sid)}
 });
 Object.values(D.shop).forEach(s=>{if(s.auto&&!D.items[s.itemId]&&!s.done)del('shop',s.id)});
}

 const prevK=mk(y,m-1),total=sumM(S.month),prev=sumM(prevK);
 const budget=+cfg().budget||0;
 let h=header('Wydatki');

 // 6 miesięcy

 const mexp=exps.filter(e=>monthKey(e.date)===S.month).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
 if(mexp.length){
  const bySt={};mexp.forEach(e=>{const k=e.store||'Inne';bySt[k]=(bySt[k]||0)+(+e.amount||0)});

  const byP={};mexp.forEach(e=>{const k=e.by||'?';byP[k]=(byP[k]||0)+(+e.amount||0)});

  let settle='';if(pp.length===2){const d=(pp[0][1]-pp[1][1])/2;if(d>0.5)settle='<div class="note" style="margin-top:8px">Żeby było po równo: <b>'+esc(pp[1][0])+'</b> oddaje <b>'+esc(pp[0][0])+'</b> '+money(d)+' 😉</div>'}

/* ---------- zakupy ---------- */
function parseShopInput(t){
 t=t.trim();let qty=null,unit=null,name=t,m;
 if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*(szt|opak|kg|g|l|ml)?\.?\s+(.+)$/i))){qty=parseNum(m[1]);unit=m[2]&&m[2].toLowerCase();name=m[3]}
 else if((m=t.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(szt|opak|kg|g|l|ml)?\.?$/i))){name=m[1];qty=parseNum(m[2]);unit=m[3]&&m[3].toLowerCase()}
 return{name:name.trim(),qty,unit};
}
function addShop(name,qty,unit,cat,itemId){
 const g=guess(name);
 const ex=Object.values(D.shop).find(s=>!s.done&&norm(s.name)===norm(name));
 if(ex){put('shop',{...ex,qty:r2((+ex.qty||0)+(qty||1))});toast('Już było — zwiększyłem ilość');return}
 const it=itemId?D.items[itemId]:findItem(name);
 put('shop',{id:uid(),name:name.charAt(0).toUpperCase()+name.slice(1),qty:qty||1,unit:unit||it?.unit||g.unit||'szt',cat:cat||it?.cat||g.cat||'inne',emoji:it?.emoji||g.emoji||'',itemId:it?.id||'',done:false,ts:Date.now()});
 toast('Na liście: '+name);
}

   else info.textContent='😕 Nie znalazłem sumy — wpisz ręcznie. (Pomaga zdjęcie z bliska, prosto, przy dobrym świetle.)';

let tessP=null;
async function scanReceipt(file,onProg){
 if(!window.Tesseract){tessP=tessP||loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');await tessP}
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('zły plik'));i.src=URL.createObjectURL(file)});
 const sc=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
 const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;
 for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=g>150?255:g<90?0:(g-90)*4.25;p[i]=p[i+1]=p[i+2]=g}
 x.putImageData(d,0,0);
 const w=await Tesseract.createWorker('pol',1,{logger:m=>{if(m.status==='recognizing text'&&onProg)onProg(m.progress)}});
 const {data:{text}}=await w.recognize(c);await w.terminate();
 return parseReceipt(text);
}
function parseReceipt(text){
 const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
 const nums=l=>[...l.replace(/(\d)\s+([.,])\s*(\d{2})/g,'$1$2$3').matchAll(/(\d{1,5})[.,](\d{2})(?!\d)/g)].map(m=>parseFloat(m[1]+'.'+m[2]));
 const keys=[/SUMA\s*(PLN)?/i,/DO\s*ZAP/i,/RAZEM/i,/TOTAAL|TOTAL/i,/ZAP[LŁ]ACONO|KARTA|GOT[OÓ]WKA|PLATNO|PŁATNO/i];
 let total=null;
 for(const k of keys){for(let i=0;i<lines.length;i++){if(k.test(lines[i])&&!/PTU|VAT|OPOD/i.test(lines[i])){let n=nums(lines[i]);if(!n.length&&lines[i+1])n=nums(lines[i+1]);if(n.length){total=n[n.length-1];break}}}if(total)break}
 if(!total){const all=lines.flatMap(nums).filter(v=>v<5000);if(all.length)total=Math.max(...all)}
 const low=text.toLowerCase();const store=STORES.find(s=>low.includes(s.toLowerCase().replace('ż','z'))||low.includes(s.toLowerCase()))||'';
 return{total,store};
}

const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /domy/{dom}/{rest=**} {
      allow read, write: if dom.size() >= 20;
    }
  }
}`;
function setupFbSheet(){
 sheet('<h2>☁️ Połącz z Firebase</h2><div class="note" style="margin-bottom:10px">Robisz to raz, na jednym telefonie (albo na komputerze). Darmowy plan w zupełności wystarczy.</div>'+
 '<ol class="steps"><li>Wejdź na <b>console.firebase.google.com</b> → <b>Utwórz projekt</b> (np. „mamyto”). Google Analytics możesz wyłączyć.</li>'+
 '<li>Z menu: <b>Build → Firestore Database → Utwórz bazę danych</b>. Lokalizacja: <code>europe-central2</code> (Warszawa). Tryb: <b>produkcyjny</b>.</li>'+
 '<li>W bazie wejdź w zakładkę <b>Reguły</b>, zastąp wszystko tym poniżej i kliknij <b>Opublikuj</b>:<div class="codebox" style="margin-top:6px;white-space:pre">'+esc(RULES)+'</div><button class="btn" id="cpRules" style="margin-top:6px;padding:9px 14px;font-size:14px">Kopiuj reguły</button></li>'+
 '<li>⚙️ <b>Ustawienia projektu</b> → na dole <b>Twoje aplikacje</b> → ikonka <b>&lt;/&gt;</b> (Web) → wpisz nazwę → <b>Zarejestruj</b>.</li>'+
 '<li>Skopiuj cały blok <code>firebaseConfig = { … }</code> i wklej tutaj:</li></ol>'+
 '<textarea class="inp" id="fbCfg" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;…&quot;,&#10;  projectId: &quot;…&quot;,&#10;  appId: &quot;…&quot;&#10;};"></textarea>'+
 '<div class="note" id="fbErr" style="color:var(--bad);margin:6px 0"></div><button class="btn pri full" id="fbGo">Połącz i utwórz nasz dom</button>',
 card=>{
  $('#cpRules',card).onclick=()=>copy(RULES,'Reguły skopiowane');
  $('#fbGo',card).onclick=async()=>{
   const c=parseConfig($('#fbCfg',card).value);if(!c){$('#fbErr',card).textContent='Nie widzę apiKey / projectId / appId — wklej cały blok konfiguracji.';return}
   const b=$('#fbGo',card);b.textContent='Łączę…';b.disabled=true;
   try{S.sync={config:c,house:randHouse()};LS.set('mt_sync',S.sync);await connectCloud(S.sync,true);closeSheet();setTimeout(pairSheet,350)}
   catch(e){S.sync=null;LS.set('mt_sync',null);S.cloud='local';$('#fbErr',card).textContent='Nie wyszło: '+(e.message||e)+'. Sprawdź reguły i czy baza Firestore jest utworzona.';b.textContent='Spróbuj ponownie';b.disabled=false;render()}
  };
 });
}

 const code=pairCode();
 sheet('<h2>🔗 Kod dla drugiej osoby</h2><div class="note" style="margin-bottom:10px">Wyślij ten kod (np. Messengerem). Druga osoba: <b>Więcej → Mam kod od partnera</b> → wkleja. Na iPhonie — w apce otwartej z ikonki na ekranie.</div><div class="codebox">'+esc(code)+'</div><div class="btnrow" style="margin-top:12px"><button class="btn pri" id="pCopy">Kopiuj</button>'+(navigator.share?'<button class="btn" id="pShare">Wyślij…</button>':'')+'</div><div class="note" style="margin-top:12px">Ten kod to klucz do waszych wspólnych danych — nie wrzucaj go publicznie.</div>',

function copy(t,msg){
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Zaznacz i skopiuj ręcznie')}a.remove()});
}
function welcome(){
 sheet('<div style="text-align:center;font-size:54px;margin-top:4px">🧊🛒</div><h2 style="text-align:center">Mamy to?</h2><div class="note" style="text-align:center;margin-bottom:16px">Wspólna lodówka, lista zakupów i wydatki — dla was dwojga.</div>'+
 '<div class="f"><label>Jak masz na imię?</label><input class="inp" id="wName" placeholder="Wpisz swoje imię" autocomplete="off"></div>'+
 '<div class="f"><label>Wybierz motyw</label><div class="themes">'+THEMES.map(t=>'<button type="button" class="th '+(S.theme===t[0]?'on':'')+'" data-v="'+t[0]+'"><div class="sw3">'+themeSw(t[0])+'</div><span class="e">'+t[2]+'</span><br>'+t[1]+'</button>').join('')+'</div></div>'+
 '<button class="btn pri full" id="wGo">Zaczynamy</button><button class="btn full" id="wJoin" style="margin-top:10px">🔑 Mam kod od partnera</button>',
 card=>{

/* ---------- akcje ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;LS.set('mt_tab',S.tab);render();window.scrollTo(0,0);return}
 const a=e.target.closest('#view [data-act]');if(!a)return;
 const id=a.dataset.id,act=a.dataset.act;
 switch(act){
  case'place':S.place=a.dataset.v;render();break;
  case'filterExp':S.place='exp';render();break;
  case'goShop':S.tab='zakupy';render();break;
  case'editItem':itemSheet(id);break;
  case'inc':case'dec':{const it=D.items[id];if(!it)break;const st=STEP[it.unit]||1;const nq=r2(Math.max(0,(+it.qty||0)+(act==='inc'?st:-st)));
   put('items',{...it,qty:nq,noAuto:null});
   if(act==='dec'&&nq<=0&&!(+it.min>0))toast('Skończyło się: '+it.name,[{label:'Na listę',fn:()=>addShop(it.name,1,it.unit,it.cat,it.id)},{label:'Usuń',fn:()=>del('items',it.id)}]);
   else if(act==='dec'&&+it.min>0&&nq<+it.min&&(+it.qty||0)>=+it.min)toast('★ '+it.name+' dopisane do listy');
   break}
  case'shopAdd':{const inp=$('#shopIn');const p=parseShopInput(inp.value);if(p.name){addShop(p.name,p.qty,p.unit);inp.value='';$('#sugg').innerHTML=''}inp.focus();break}
  case'toggleShop':{const s=D.shop[id];if(s)put('shop',{...s,done:!s.done});break}
  case'editShop':shopEditSheet(id);break;
  case'finish':finishSheet();break;
  case'mon':{const[y,m]=S.month.split('-').map(Number);const d=new Date(y,m-1+(+a.dataset.v),1);S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();break}
  case'setMon':S.month=a.dataset.v;render();break;
  case'addExp':expSheet();break;
  case'scanExp':expSheet(null,true);break;
  case'editExp':expSheet(id);break;
  case'theme':S.theme=a.dataset.v;LS.set('mt_theme',S.theme);render();break;
  case'cur':put('cfg',{...cfg(),id:'main',cur:a.dataset.v});break;
  case'setupFb':setupFbSheet();break;
  case'joinFb':joinSheet();break;
  case'showPair':pairSheet();break;
  case'unpair':sheet('<h2>Rozłączyć?</h2><div class="note" style="margin-bottom:14px">Ten telefon przestanie się synchronizować. Wspólne dane w chmurze zostają — możesz wrócić tym samym kodem.</div><button class="btn bad full" id="uGo">Rozłącz</button>',c=>$('#uGo',c).onclick=()=>{disconnect();closeSheet()});break;
  case'export':{if(window.Android){copy(JSON.stringify({v:1,items:D.items,shop:D.shop,exp:D.exp,cfg:D.cfg}),'Kopia skopiowana — wklej ją np. do notatek');break}const b=new Blob([JSON.stringify({v:1,items:D.items,shop:D.shop,exp:D.exp,cfg:D.cfg},null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='mamyto-kopia-'+todayStr()+'.json';document.body.appendChild(l);l.click();l.remove();break}
  case'import':{if(window.Android){sheet('<h2>Wczytaj kopię</h2><textarea class="inp" id="impT" placeholder="Wklej tu skopiowaną kopię"></textarea><button class="btn pri full" id="impGo" style="margin-top:10px">Wczytaj</button>',c=>$('#impGo',c).onclick=()=>{try{const o=JSON.parse($('#impT',c).value);let n=0;['items','shop','exp','cfg'].forEach(k=>Object.values(o[k]||{}).forEach(x=>{put(k,x);n++}));closeSheet();toast('Wczytano '+n+' wpisów')}catch(e){toast('To nie jest dobra kopia')}});break}
   const f=document.createElement('input');f.type='file';f.accept='application/json,.json';f.onchange=async()=>{try{const o=JSON.parse(await f.files[0].text());let n=0;['items','shop','exp','cfg'].forEach(c=>Object.values(o[c]||{}).forEach(x=>{put(c,x);n++}));toast('Wczytano '+n+' wpisów')}catch(e){toast('To nie jest dobry plik kopii')}};f.click();break}
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;render()}
 if(e.target.id==='shopIn')shopSugg();
});
document.addEventListener('change',e=>{
 if(e.target.id==='meName'){S.me=e.target.value.trim();LS.set('mt_me',S.me);render()}
 if(e.target.id==='budget'){put('cfg',{...cfg(),id:'main',budget:r2(parseNum(e.target.value))})}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='shopIn'){e.preventDefault();$('[data-act=shopAdd]').click()}});
document.addEventListener('click',e=>{const b=e.target.closest('#sugg [data-n]');if(!b)return;const inp=$('#shopIn');const p=parseShopInput(inp.value);addShop(b.dataset.n,p.qty,p.unit);inp.value='';$('#sugg').innerHTML='';inp.focus()});
$('#fab').onclick=()=>S.tab==='wydatki'?expSheet():itemSheet();

render();
autoShop();
if(!S.me)setTimeout(welcome,250);

if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.Android)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(S.tab==='zapasy'&&!$('#sheet').classList.contains('open')&&document.activeElement.id!=='q')render()},60000);
